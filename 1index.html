<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>وعد مجهول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column on a midnight-blue ground lit by coral, sun and mint glows. Gradient is the signature: headline text, primary button, seal, and a gradient outline that cycles through the incoming promises. */
:root {
  --bg: #f1f5ff;
  --fg: #0c1a3d;
  --muted: #55668f;
  --card: #ffffff;
  --line: #d3ddf4;
  --a1: #ff6340;
  --a2: #ffae14;
  --a3: #10b894;
  --a4: #2e8bff;
  --onacc: #2a0e05;
  --glow: 26%;
  --bad: #b3261e;
  --font-display: "Lalezar", "Tajawal", system-ui, sans-serif;
  --font-body: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glow: 12%;
    --bg: #000000; --fg: #f4f4f4; --muted: #9b9b9b; --card: #0e0e0e; --line: #2a2a2a;
    --a1: #ff7a59; --a2: #ffc247; --a3: #34e0b8; --a4: #5aa8ff; --bad: #ff9d94;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --glow: 12%;
  --bg: #000000; --fg: #f4f4f4; --muted: #9b9b9b; --card: #0e0e0e; --line: #2a2a2a;
  --a1: #ff7a59; --a2: #ffc247; --a3: #34e0b8; --a4: #5aa8ff; --bad: #ff9d94;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(70% 38% at 100% 0%, color-mix(in srgb, var(--a1) var(--glow), transparent), transparent 70%),
    radial-gradient(60% 34% at 0% 14%, color-mix(in srgb, var(--a3) var(--glow), transparent), transparent 70%),
    radial-gradient(70% 30% at 70% 100%, color-mix(in srgb, var(--a4) var(--glow), transparent), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.6;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(40px, 12.5vw, 58px); line-height: 1.08; overflow-wrap: anywhere; }
h2 { font-size: 26px; line-height: 1.25; }
p { margin: 0; }
.grad { background: linear-gradient(95deg, var(--a2), var(--a1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }

.bar { display: flex; justify-content: flex-end; gap: 8px; }
.brand { display: flex; align-items: center; gap: 12px; }
.seal {
  flex: none; width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--a2), var(--a1)); color: var(--onacc);
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 22px; line-height: 1;
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--onacc) 18%, transparent), 0 8px 22px -6px color-mix(in srgb, var(--a1) 70%, transparent);
}
.eyebrow { font-weight: 700; font-size: 17px; color: var(--muted); }

.card {
  position: relative;
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
input[type="text"], input[type="password"], textarea {
  width: 100%; font: inherit; font-size: 19px; color: var(--fg); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 15px;
}
textarea { min-height: 170px; resize: none; background: transparent; border-color: transparent; padding: 2px; font-size: 21px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
input:focus-visible { outline: none; border-color: var(--a2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--a2) 30%, transparent); }
textarea:focus-visible { outline: none; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--a2); outline-offset: 3px; }

button, .btn {
  font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; border: 0; border-radius: 14px;
  padding: 13px 20px; color: var(--onacc);
  background: linear-gradient(135deg, var(--a2), var(--a1));
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--a1) 80%, transparent);
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center;
  transition: transform .12s ease, filter .12s ease;
}
button:hover, .btn:hover { filter: brightness(1.05); }
button:active:not(:disabled), .btn:active { transform: scale(.97); }
button:disabled { opacity: .55; cursor: not-allowed; }
button.wide { width: 100%; }
button.alt, .btn.alt { background: transparent; color: var(--fg); border: 1.5px solid var(--line); box-shadow: none; }
button.small { font-size: 15px; padding: 7px 14px; }
button.link { background: none; box-shadow: none; color: var(--muted); padding: 0; font-size: 16px; font-weight: 500; text-decoration: underline; border-radius: 6px; align-self: center; }
.msg { font-size: 16px; min-height: 1.2em; color: var(--muted); }
.msg.bad { color: var(--bad); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: flex-end; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 16px; padding: 5px; }
.seg button { background: transparent; color: var(--muted); box-shadow: none; padding: 9px 10px; font-size: 17px; border-radius: 12px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, var(--a2), var(--a1)); color: var(--onacc); }

.linkrow { display: flex; gap: 8px; align-items: stretch; }
.linkrow code {
  flex: 1; min-width: 0; direction: ltr; text-align: left; overflow-x: auto; white-space: nowrap;
  border: 1.5px dashed var(--line); border-radius: 14px; padding: 8px 12px; font-size: 14px; background: var(--bg);
  display: flex; align-items: center; color: var(--fg);
}
.actions { display: flex; gap: 10px; }
.actions > * { flex: 1; }

.sechead { display: flex; align-items: center; gap: 12px; }
.sechead h1 { flex: 1; min-width: 0; }
.badge {
  min-width: 42px; height: 42px; padding: 0 12px; border-radius: 999px;
  background: linear-gradient(135deg, var(--a3), var(--a4)); color: #04122b;
  font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.inbox { display: flex; flex-direction: column; gap: 14px; padding: 0; margin: 0; list-style: none; }
.promise {
  --g1: var(--a2); --g2: var(--a1);
  border: 2px solid transparent; border-radius: 22px; padding: 16px 18px;
  background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(135deg, var(--g1), var(--g2)) border-box;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.promise:nth-child(4n+2) { --g1: var(--a3); --g2: var(--a4); }
.promise:nth-child(4n+3) { --g1: var(--a1); --g2: var(--a4); }
.promise:nth-child(4n+4) { --g1: var(--a2); --g2: var(--a3); }
.promise .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 21px; line-height: 1.5; }
.promise .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; border: 1.5px dashed var(--line); border-radius: 22px; }

footer { margin-top: 18px; text-align: center; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
footer b { color: var(--fg); font-weight: 700; letter-spacing: .02em; }

.stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.stamp span {
  width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--a2), var(--a1)); color: var(--onacc);
  font-family: var(--font-display); font-size: 48px;
  box-shadow: inset 0 0 0 8px color-mix(in srgb, var(--onacc) 18%, transparent), 0 16px 40px -8px color-mix(in srgb, var(--a1) 70%, transparent);
  animation: stamp 1.7s ease both;
}
@keyframes stamp {
  0% { transform: scale(2.4) rotate(-24deg); opacity: 0; }
  22% { transform: scale(1) rotate(-8deg); opacity: 1; }
  80% { transform: scale(1) rotate(-8deg); opacity: 1; }
  100% { transform: scale(1) rotate(-8deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .stamp span { animation: none; transform: rotate(-8deg); } }
@media (prefers-reduced-motion: no-preference) {
  .promise { animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>

<main dir="rtl" lang="ar">
  <div class="bar"><button id="tg" class="alt small" type="button">وضع ليلي</button></div>
  <div id="view"><div class="empty">…</div></div>
  <footer><span dir="ltr"><b>By Mohamed Gomaa</b></span><span>جميع الحقوق محفوظة</span></footer>
</main>

<script>
(function () {
  var view = document.getElementById("view");
  var db = null, user = null, canWrite = null;
  var unsub = null, ready = false, routeToken = 0, memMe = null;
  var MAXLEN = 300;
  var root = document.documentElement;

  /* ---------- theme ---------- */
  var tg = document.getElementById("tg");
  function effective() {
    var t = root.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t;
    try { return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; }
  }
  function paintToggle() { tg.textContent = effective() === "dark" ? "وضع نهاري" : "وضع ليلي"; }
  try { var st = localStorage.getItem("wad-theme"); if (st === "dark" || st === "light") root.setAttribute("data-theme", st); } catch (e) {}
  paintToggle();
  tg.addEventListener("click", function () {
    var next = effective() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("wad-theme", next); } catch (e) {}
    paintToggle();
  });

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toHex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function fromHex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function normName(n) { return n.trim().toLowerCase().replace(/\s+/g, " "); }
  async function idFor(name) {
    var d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("wad:" + normName(name)));
    return toHex(d).slice(0, 12);
  }
  async function hashPass(pass, saltHex) {
    var key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: fromHex(saltHex), iterations: 100000, hash: "SHA-256" }, key, 256);
    return toHex(bits);
  }
  function getMe() {
    try { var v = JSON.parse(localStorage.getItem("wad-me") || "null"); if (v && v.code) return v; } catch (e) {}
    return memMe;
  }
  function setMe(me) { memMe = me; try { if (me) localStorage.setItem("wad-me", JSON.stringify(me)); else localStorage.removeItem("wad-me"); } catch (e) {} }
  function hashCode() { return (location.hash || "").replace(/^#/, "").trim().toLowerCase(); }
  function shareUrl(code) { return location.href.split("#")[0] + "#" + code; }
  var fmt;
  try { fmt = new Intl.DateTimeFormat("ar-EG", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { fmt = null; }
  function when(t) { try { return fmt ? fmt.format(new Date(t)) : new Date(t).toLocaleString(); } catch (e) { return ""; } }
  function stopInbox() { if (unsub) { unsub(); unsub = null; } }
  function brand(label) {
    return '<div class="brand"><div class="seal" aria-hidden="true">وعد</div><span class="eyebrow">' + esc(label || "وعد مجهول") + '</span></div>';
  }

  /* ---------- views ---------- */

  function renderHome(mode) {
    stopInbox();
    mode = mode || "signup";
    view.innerHTML =
      brand() +
      '<h1><span class="grad">خلّي صحابك يوعدوك</span></h1>' +
      '<div class="card">' +
        '<div class="seg" role="group"><button id="m1" type="button" aria-pressed="' + (mode === "signup") + '">حساب جديد</button>' +
        '<button id="m2" type="button" aria-pressed="' + (mode === "login") + '">دخول</button></div>' +
        '<input id="nm" type="text" maxlength="30" placeholder="الاسم" autocomplete="username" aria-label="الاسم">' +
        '<input id="pw" type="password" maxlength="60" placeholder="الباسورد" autocomplete="' + (mode === "signup" ? "new-password" : "current-password") + '" aria-label="الباسورد">' +
        '<button id="go" class="wide" type="button">' + (mode === "signup" ? "اعمل حسابي" : "دخول") + '</button>' +
        '<span id="hm" class="msg" role="status"></span>' +
      '</div>';
    var nm = document.getElementById("nm"), pw = document.getElementById("pw"), go = document.getElementById("go"), hm = document.getElementById("hm");
    document.getElementById("m1").addEventListener("click", function () { renderHome("signup"); });
    document.getElementById("m2").addEventListener("click", function () { renderHome("login"); });
    function fail(t) { hm.className = "msg bad"; hm.textContent = t; go.disabled = false; }
    go.addEventListener("click", async function () {
      var name = nm.value.trim(), pass = pw.value;
      if (name.length < 2) return fail("اكتب اسمك.");
      if (pass.length < 4) return fail("الباسورد 4 حروف على الأقل.");
      if (!db) return fail("افتح الصفحة وانت مسجّل دخول بحساب Claude.");
      if (!(window.crypto && crypto.subtle)) return fail("المتصفح مش بيدعم التشفير المطلوب.");
      go.disabled = true; hm.className = "msg"; hm.textContent = "…";
      try {
        var code = await idFor(name);
        var ref = db.doc("profiles/" + code);
        var snap = await ref.get();
        if (mode === "signup") {
          if (snap.exists) return fail("الاسم ده مستخدم. جرّب اسم تاني.");
          var salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
          var h = await hashPass(pass, salt);
          await ref.set({ name: name, salt: salt, hash: h, at: Date.now() });
        } else {
          if (!snap.exists) return fail("الاسم أو الباسورد غلط.");
          var d = snap.data();
          var h2 = await hashPass(pass, d.salt || "");
          if (h2 !== d.hash) return fail("الاسم أو الباسورد غلط.");
          name = d.name || name;
        }
        setMe({ code: code, name: name });
        location.hash = code;
        route();
      } catch (e) { fail("حصلت مشكلة. جرّب تاني."); }
    });
  }

  function renderInbox(me) {
    stopInbox();
    var link = shareUrl(me.code);
    var wa = "https://wa.me/?text=" + encodeURIComponent("اكتبلي وعد من غير ما أعرف مين: " + link);
    var fb = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(link);
    view.innerHTML =
      '<div class="sechead"><div class="seal" aria-hidden="true">وعد</div><h1><span class="grad">وعودك</span></h1><span id="bd" class="badge">0</span></div>' +
      '<div class="card">' +
        '<div class="linkrow"><code id="lk"></code><button id="cp" class="small" type="button">انسخ</button></div>' +
        '<div class="actions"><a class="btn alt" href="' + esc(wa) + '" target="_blank" rel="noopener">واتساب</a>' +
        '<a class="btn alt" href="' + esc(fb) + '" target="_blank" rel="noopener">فيسبوك</a></div>' +
        '<span id="cm" class="msg" role="status"></span>' +
      '</div>' +
      '<ul id="list" class="inbox"></ul>' +
      '<div id="emp" class="empty">لسه مفيش وعود</div>' +
      '<button id="out" class="link" type="button">خروج من حساب ' + esc(me.name) + '</button>';
    var lk = document.getElementById("lk");
    lk.textContent = link;
    var cm = document.getElementById("cm");
    document.getElementById("out").addEventListener("click", function () { setMe(null); location.hash = ""; route(); });
    document.getElementById("cp").addEventListener("click", function () {
      var done = function () { cm.className = "msg"; cm.textContent = "اتنسخ."; };
      var fail = function () {
        cm.className = "msg"; cm.textContent = "اضغط مطوّلاً على اللينك وانسخه.";
        var r = document.createRange(); r.selectNodeContents(lk);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      };
      try { navigator.clipboard.writeText(link).then(done, fail); } catch (e) { fail(); }
    });
    var list = document.getElementById("list"), emp = document.getElementById("emp"), bd = document.getElementById("bd");
    if (!db) { emp.textContent = "افتح الصفحة وانت مسجّل دخول بحساب Claude."; return; }
    unsub = db.collection("promises").where("to", "==", me.code).orderBy("at", "desc").limit(200).onSnapshot(function (snap) {
      list.innerHTML = "";
      emp.hidden = !snap.empty;
      bd.textContent = String(snap.size);
      snap.docs.forEach(function (d) {
        var p = d.data();
        var li = document.createElement("li");
        li.className = "promise";
        var txt = document.createElement("div"); txt.className = "txt"; txt.textContent = p.text || "";
        var meta = document.createElement("div"); meta.className = "meta";
        var t = document.createElement("span"); t.textContent = "مجهول · " + when(p.at);
        var del = document.createElement("button"); del.className = "alt small"; del.type = "button"; del.textContent = "امسح";
        del.addEventListener("click", function () { del.disabled = true; d.ref.delete().catch(function () { del.disabled = false; }); });
        meta.appendChild(t); meta.appendChild(del);
        li.appendChild(txt); li.appendChild(meta);
        list.appendChild(li);
      });
    }, function () { emp.hidden = false; emp.textContent = "ماقدرناش نحمّل الوعود."; });
  }

  function renderSend(code, name) {
    stopInbox();
    if (!db) {
      view.innerHTML = brand() + '<div class="card"><h2>افتح الصفحة وانت مسجّل دخول بحساب Claude عشان تبعت</h2></div>';
      return;
    }
    view.innerHTML =
      brand("وعد مجهول إلى") +
      '<h1><span class="grad"><bdi id="who"></bdi></span></h1>' +
      '<div class="card" id="box">' +
        '<textarea id="tx" maxlength="' + MAXLEN + '" placeholder="أوعدك إني…" aria-label="وعدك"></textarea>' +
        '<span class="count" id="ct">0 / ' + MAXLEN + '</span>' +
        '<button id="sd" class="wide" type="button">اختم الوعد</button>' +
        '<span id="sm" class="msg" role="status"></span>' +
      '</div>' +
      '<button id="mine" class="link" type="button">' + (getMe() ? "رجوع لحسابي" : "اعمل حسابك") + '</button>';
    document.getElementById("who").textContent = name;
    var tx = document.getElementById("tx"), sd = document.getElementById("sd"), sm = document.getElementById("sm"), ct = document.getElementById("ct"), box = document.getElementById("box");
    tx.addEventListener("input", function () { ct.textContent = tx.value.length + " / " + MAXLEN; });
    document.getElementById("mine").addEventListener("click", function () { location.hash = ""; route(); });
    sd.addEventListener("click", function () {
      var text = tx.value.trim();
      if (text.length < 3) { sm.className = "msg bad"; sm.textContent = "الوعد قصير."; return; }
      sd.disabled = true; sm.className = "msg"; sm.textContent = "…";
      db.collection("promises").add({ to: code, text: text.slice(0, MAXLEN), at: Date.now() }).then(function () {
        tx.value = ""; ct.textContent = "0 / " + MAXLEN; sm.textContent = "";
        var s = document.createElement("div"); s.className = "stamp"; s.setAttribute("aria-hidden", "true");
        s.innerHTML = "<span>تم</span>";
        box.appendChild(s);
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1800);
        sd.disabled = false;
      }).catch(function () {
        sd.disabled = false; sm.className = "msg bad";
        sm.textContent = canWrite === false ? "حسابك مش مسموحله يبعت هنا." : "ماتبعتش. جرّب تاني.";
      });
    });
  }

  function renderMissing() {
    stopInbox();
    view.innerHTML = brand() + '<h1><span class="grad">اللينك ده مش موجود</span></h1><button id="mine" class="wide" type="button">ارجع للرئيسية</button>';
    document.getElementById("mine").addEventListener("click", function () { location.hash = ""; route(); });
  }

  /* ---------- routing ---------- */

  function route() {
    if (!ready) return;
    var token = ++routeToken;
    var h = hashCode(), me = getMe();

    if (h) {
      if (me && me.code === h) return renderInbox(me);
      if (!db) return renderSend(h, "صاحب اللينك");
      db.doc("profiles/" + h).get().then(function (snap) {
        if (token !== routeToken) return;
        if (!snap.exists) return renderMissing();
        renderSend(h, snap.data().name || "صاحب اللينك");
      }).catch(function () { if (token === routeToken) renderMissing(); });
      return;
    }
    if (me) { location.hash = me.code; return; }
    renderHome("signup");
  }

  window.addEventListener("hashchange", route);

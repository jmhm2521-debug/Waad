<style>
:root{--bg:#101329;--panel:#191e3a;--panel2:#252b4d;--text:#f8f8ff;--muted:#b6bddb;--line:#394166;--pink:#ff6da7;--gold:#ffc06e;--green:#55dbb7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#49264f 0,transparent 38%),radial-gradient(ellipse at 100% 45%,#18385a 0,transparent 40%),var(--bg);font-family:'Tajawal',sans-serif;color:var(--text);padding:18px 14px 28px;line-height:1.65;font-size:17px}main{max-width:560px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-icon{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--gold));color:#281126;font-size:24px}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:13px}.hero{text-align:center;padding:18px 5px 23px}.hero-emoji{font-size:43px;display:block}.hero h1{font-size:clamp(37px,10vw,52px);line-height:1.13;margin:5px 0 12px;font-weight:800;letter-spacing:-1px}.gradient{background:linear-gradient(100deg,#ff80b4,#ffd087,#aeb7ff);color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{color:var(--muted);max-width:420px;margin:auto}.card{background:linear-gradient(150deg,#1c2140f5,#151930f7);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:15px;box-shadow:0 18px 45px #0002}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#11152c;padding:5px;border-radius:15px;margin-bottom:14px}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:11px;font-weight:700}.tabs button.active{background:linear-gradient(110deg,var(--pink),var(--gold));color:#2a1324}.field{display:block;margin:12px 0 5px;font-size:15px;font-weight:700;color:#e2e5fa}input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#10142c;color:var(--text);padding:13px 14px;font:500 16px 'Tajawal',sans-serif;outline:none}input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ff6da71f}input::placeholder,textarea::placeholder{color:#7e87af}button{font:700 16px 'Tajawal',sans-serif;cursor:pointer;transition:transform .15s,opacity .15s}button:active{transform:scale(.98)}button:disabled{opacity:.6;cursor:wait}.primary{border:0;border-radius:14px;padding:13px 17px;background:linear-gradient(110deg,var(--pink),var(--gold));color:#2a1324;box-shadow:0 8px 22px #ff6da720}.secondary{border:1px solid var(--line);border-radius:13px;padding:10px 13px;background:var(--panel2);color:var(--text)}.wide{width:100%;margin-top:14px}.msg{min-height:24px;color:var(--muted);font-size:14px;margin-top:9px}.msg.error{color:#ff9aac}.msg.good{color:var(--green)}.muted{color:var(--muted)}.notice{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}.sharebox{display:flex;gap:8px;margin-top:12px}.sharebox input{direction:ltr;text-align:left;font-size:13px;min-width:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}.section-title h2{margin:0;font-size:24px}.count{background:#2c3155;border:1px solid #444c77;border-radius:999px;padding:3px 12px;font-weight:800}.promise{background:linear-gradient(145deg,#1d2340,#171b32);border:1px solid #424a70;border-radius:19px;padding:16px;margin-bottom:11px;overflow-wrap:anywhere}.promise-text{white-space:pre-wrap;font-size:19px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:12px}.empty{text-align:center;color:var(--muted);border:1px dashed var(--line);padding:25px;border-radius:18px}.hidden{display:none!important}footer{text-align:center;color:#858caf;font-size:13px;padding:22px 0 4px}footer strong{color:#e9ebff}@media(max-width:390px){.card{padding:15px}.sharebox{flex-direction:column}}

/* Refined visual layer */
:root{--bg:#0b1020;--panel:#151d35;--panel2:#202a48;--text:#fbf8ff;--muted:#b8c2dc;--line:#334362;--pink:#ff6fae;--gold:#ffd08a;--green:#61e0bd}
body{background:radial-gradient(ellipse at 50% -12%,#633453 0,transparent 45%),radial-gradient(ellipse at 100% 36%,#1c4261 0,transparent 37%),linear-gradient(145deg,#0b1020,#10172c 60%,#0c1225);padding-top:22px}
main{max-width:590px}
.top{padding:10px 13px;border:1px solid #ffffff12;border-radius:20px;background:#ffffff08;backdrop-filter:blur(12px)}
.brand-icon{width:48px;height:48px;border-radius:17px;box-shadow:0 7px 25px #ff6da744,inset 0 1px #ffffff70;font-size:25px}
.tag{background:#ffffff08;border-color:#ffffff20;letter-spacing:.1px}
.hero{position:relative;padding:29px 12px 31px;overflow:hidden;border-radius:26px;margin:14px 0 19px;background:linear-gradient(135deg,#ffffff0c,#ffffff02);border:1px solid #ffffff10}
.hero:before,.hero:after{content:'✦';position:absolute;color:#ffd08a55;font-size:34px;pointer-events:none}.hero:before{top:15px;right:23px}.hero:after{bottom:18px;left:25px;font-size:24px}
.hero-emoji{filter:drop-shadow(0 6px 12px #ff6da733);font-size:47px;animation:floaty 4s ease-in-out infinite}
.hero h1{margin-top:9px;text-shadow:0 6px 24px #ff6da710}
.gradient{background:linear-gradient(100deg,#ff83b8 5%,#ffd18a 55%,#b5c1ff);background-clip:text;-webkit-background-clip:text}
.hero p{font-size:17px;line-height:1.9}
.card{background:linear-gradient(145deg,#19233df2,#121a30f7);border:1px solid #a9c5ff20;border-radius:25px;padding:22px;box-shadow:0 20px 55px #0003,inset 0 1px #ffffff08;backdrop-filter:blur(12px)}
.tabs{background:#0d1429;border:1px solid #ffffff0b;padding:5px}.tabs button{padding:12px 8px}.tabs button.active{box-shadow:0 5px 16px #ff6da72b}
input,textarea{background:#0c1429;border-color:#344260;border-radius:14px;transition:border-color .2s,box-shadow .2s,background .2s}input:focus,textarea:focus{background:#101a31;border-color:#ff83b8;box-shadow:0 0 0 4px #ff6da718}
.primary{background:linear-gradient(105deg,#ff79b1,#ffc981);box-shadow:0 9px 24px #ff6da72b,inset 0 1px #ffffff70;font-weight:800}.primary:hover{filter:brightness(1.05)}
.secondary{background:linear-gradient(145deg,#222d4b,#1a2440);border-color:#ffffff1a}.secondary:hover{border-color:#ff83b866}
.wide{min-height:49px}.notice{padding-top:5px}
.promise{background:linear-gradient(135deg,#202b4b,#151f38);border-color:#8299c52a;box-shadow:0 8px 25px #0002}.promise-text{line-height:1.85}
.count{background:#ff6fae16;border-color:#ff6fae55;color:#ffc3dc}
.empty{background:#ffffff04;border-color:#56668b;color:#c1cbe1;line-height:1.9}
.site-footer{display:flex;flex-direction:column;align-items:center;gap:5px;padding:26px 0 8px;color:#a7b2ce;font-size:13px;letter-spacing:.2px}.site-footer strong{color:#ffe0b6;font-size:14px}.site-footer span{color:#7f8ba9}.footer-rule{width:68px;height:3px;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--gold));margin-bottom:9px;opacity:.9}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(max-width:390px){.hero{padding:25px 8px}.card{padding:17px}.top{gap:7px}.tag{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

</style></head><body><main>
<header class="top"><div class="brand"><span class="brand-icon">و</span><span>وعد مجهول</span></div><span class="tag">🌙 الوضع الليلي</span></header>
<section class="hero"><span class="hero-emoji">💌</span><h1><span class="gradient">وعد مجهول</span></h1></section>
<div id="app"><section class="card"><div class="tabs"><button id="signupTab" class="active" type="button">حساب جديد</button><button id="loginTab" type="button">تسجيل الدخول</button></div><form id="authForm"><label class="field" for="name">الاسم</label><input id="name" type="text" maxlength="30" placeholder="اسمك" autocomplete="nickname" required><label class="field" for="email">الإيميل</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required><label class="field" for="password">كلمة المرور</label><input id="password" type="password" minlength="6" placeholder="6 أحرف على الأقل" autocomplete="new-password" required><button id="authSubmit" class="primary wide" type="submit">اعمل حسابي</button><div id="authMsg" class="msg" role="status"></div></form></section></div>
<footer class="site-footer"><div class="footer-rule"></div><strong>By Mohamed Gomaa</strong><span>جميع الحقوق محفوظة © 2026</span></footer></main>
<script>
const $=id=>document.getElementById(id);
const DBKEY='waad_local_v1';let mode='signup';
function db(){try{return JSON.parse(localStorage.getItem(DBKEY)||'{"users":[],"promises":[]}')}catch{return {users:[],promises:[]}}}
function save(d){localStorage.setItem(DBKEY,JSON.stringify(d))}
function current(){const id=localStorage.getItem('waad_current');return db().users.find(u=>u.id===id)||null}
function msg(id,text,type=''){const e=$(id);if(e){e.textContent=text;e.className='msg '+type}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modeSet(m){mode=m;$('signupTab')?.classList.toggle('active',m==='signup');$('loginTab')?.classList.toggle('active',m==='login');if($('authSubmit'))$('authSubmit').textContent=m==='signup'?'اعمل حسابي':'دخول';if($('name'))$('name').closest('label')?.classList.toggle('hidden',m!=='signup');if($('name'))$('name').classList.toggle('hidden',m!=='signup');msg('authMsg','')}
function showAuth(){ $('app').innerHTML=`<section class="card"><div class="tabs"><button id="signupTab" type="button">حساب جديد</button><button id="loginTab" type="button">تسجيل الدخول</button></div><form id="authForm"><div id="nameWrap"><label class="field" for="name">اسمك</label><input id="name" maxlength="30" placeholder="اسمك" autocomplete="nickname"></div><label class="field" for="email">الإيميل</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required><label class="field" for="password">كلمة المرور</label><input id="password" type="password" minlength="6" placeholder="6 أحرف على الأقل" autocomplete="current-password" required><button id="authSubmit" class="primary wide" type="submit">اعمل حسابي</button><div id="authMsg" class="msg" role="status"></div></form><p class="notice">نسخة بدون خدمات خارجية؛ الحسابات والبيانات محفوظة على هذا الجهاز فقط.</p></section>`;modeSet(mode);$('nameWrap').classList.toggle('hidden',mode!=='signup');$('name').required=mode==='signup';$('signupTab').onclick=()=>{mode='signup';showAuth()};$('loginTab').onclick=()=>{mode='login';showAuth()};$('authForm').onsubmit=authSubmit}
function authSubmit(e){e.preventDefault();const d=db(),email=$('email').value.trim().toLowerCase(),password=$('password').value,name=($('name')?.value||'').trim();if(mode==='signup'){if(name.length<2){msg('authMsg','اكتب اسمك من حرفين على الأقل.','error');return}if(d.users.some(u=>u.email===email)){msg('authMsg','الإيميل مسجل بالفعل. جرّب تسجيل الدخول.','error');return}const u={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,email,password};d.users.push(u);save(d);localStorage.setItem('waad_current',u.id);location.hash=u.id;render()}else{const u=d.users.find(u=>u.email===email&&u.password===password);if(!u){msg('authMsg','الإيميل أو كلمة المرور غير صحيحة على هذا الجهاز.','error');return}localStorage.setItem('waad_current',u.id);location.hash=u.id;render()}}
function showHome(user){const link=location.origin+location.pathname+'#'+user.id;const d=db(),promises=d.promises.filter(p=>p.to===user.id).sort((a,b)=>b.createdAt-a.createdAt);$('app').innerHTML=`<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="muted">أهلًا بيك 👋</div><h2 style="margin:0;font-size:27px">${esc(user.name)}</h2></div><button id="logout" class="secondary" type="button">خروج</button></div><div class="sharebox"><input id="myLink" readonly value="${esc(link)}"><button id="copy" class="primary" type="button">نسخ اللينك</button></div><div class="actions"><button id="wa" class="secondary" type="button">واتساب 💚</button><button id="fb" class="secondary" type="button">فيسبوك 🔵</button></div><div id="shareMsg" class="msg"></div><p class="notice">ملاحظة: بدون خادم، الرابط لا ينقل البيانات بين أجهزة مختلفة.</p></section><div class="section-title"><h2>وعودك 💌</h2><span class="count">${promises.length}</span></div><div id="list"></div>${promises.length?'':'<div class="empty">لسه مفيش وعود 🤍</div>'}`;promises.forEach(p=>{const el=document.createElement('article');el.className='promise';const t=document.createElement('div');t.className='promise-text';t.textContent=p.text;const m=document.createElement('div');m.className='meta';const date=document.createElement('span');date.textContent=new Date(p.createdAt).toLocaleString('ar-EG');const del=document.createElement('button');del.className='secondary';del.textContent='حذف';del.onclick=()=>{const x=db();x.promises=x.promises.filter(q=>q.id!==p.id);save(x);render()};m.append(date,del);el.append(t,m);$('list').append(el)});$('logout').onclick=()=>{localStorage.removeItem('waad_current');location.hash='';render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);msg('shareMsg','اتنسخ اللينك ❤️','good')}catch{$('myLink').select();msg('shareMsg','انسخ اللينك يدويًا')}};$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('💌 وعد مجهول\n'+link),'_blank');$('fb').onclick=()=>window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link),'_blank')}
function showSend(user){$('app').innerHTML=`<section class="card"><div class="muted">💌 وعد مجهول إلى</div><h2 class="gradient" style="font-size:31px;margin:0">${esc(user.name)}</h2><label class="field" for="promise">اكتب وعدك</label><textarea id="promise" rows="5" maxlength="300" placeholder="أوعدك إني…"></textarea><div id="chars" class="muted" style="text-align:left;font-size:13px">0 / 300</div><button id="send" class="primary wide" type="button">إرسال 💌</button><div id="sendMsg" class="msg"></div><p class="notice">هذا النموذج يحفظ الوعد على هذا الجهاز فقط.</p></section>`;$('promise').oninput=()=>$('chars').textContent=$('promise').value.length+' / 300';$('send').onclick=()=>{const text=$('promise').value.trim();if(text.length<3){msg('sendMsg','اكتب وعدًا أطول شوية.','error');return}const d=db();d.promises.push({id:String(Date.now()),to:user.id,text,createdAt:Date.now()});save(d);$('promise').value='';$('chars').textContent='0 / 300';msg('sendMsg','تم حفظ الوعد على هذا الجهاز 🤍','good')}}
function render(){const hash=location.hash.slice(1),d=db();if(hash){const target=d.users.find(u=>u.id===hash);if(!target){$('app').innerHTML='<section class="card"><h2>الحساب غير موجود على هذا الجهاز</h2><p class="muted">لأن الموقع لا يستخدم خدمة تخزين مشتركة، لا يمكن فتح حساب من جهاز آخر.</p><button class="primary wide" onclick="location.hash=\'\';render()">الرئيسية</button></section>';return}const u=current();if(u&&u.id===target.id)showHome(u);else showSend(target);return}const u=current();if(u)showHome(u);else showAuth()}
render();window.addEventListener('hashchange',render);
</script></body></html>
